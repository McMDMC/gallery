name: Skill tests

on:
  push:
    branches: ["main"]
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run skill unit tests
        run: node --test skills/featured/millwright-toolkit/tests/calc.test.js
